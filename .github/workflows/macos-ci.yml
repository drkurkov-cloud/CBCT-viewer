name: macOS build and smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests
        run: swift test -v

      - name: Build application bundle
        run: ./scripts/build_app.sh

      - name: Inspect executable
        run: |
          file "dist/CBCT Viewer.app/Contents/MacOS/CBCTViewerMac"
          codesign --verify --deep --strict --verbose=2 "dist/CBCT Viewer.app"
          plutil -lint "dist/CBCT Viewer.app/Contents/Info.plist"

      - name: Upload tested application
        uses: actions/upload-artifact@v4
        with:
          name: CBCT-Viewer-macOS-tested
          path: dist/CBCT_Viewer_macOS_*.zip
          if-no-files-found: error
          retention-days: 14
